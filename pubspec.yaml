name: aegis
description: >-
  Security audit for Flutter apps that checks whether your protections actually
  work, not just whether they exist. OWASP MASVS-mapped rules, MAS profile
  scoring (L1/L2/R), and reports in English and Arabic.
version: 0.8.0
repository: https://github.com/khaledSayedAbdellah/aegis
issue_tracker: https://github.com/khaledSayedAbdellah/aegis/issues

topics:
  - security
  - static-analysis
  - cli
  - owasp
  - flutter

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  archive: ^4.0.0
  args: ^2.4.0
  crypto: ^3.0.0
  path: ^1.8.0
  xml: '>=6.0.0 <8.0.0'
  yaml: ^3.1.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.24.0

executables:
  aegis: aegis
