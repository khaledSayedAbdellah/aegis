name: aegis
description: >-
  Security audit for Flutter, React Native, KMP and native Android/iOS apps:
  OWASP MASVS-mapped rules, MAS profile scoring (L1/L2/R), and reports in
  English and Arabic.
version: 0.12.0
repository: https://github.com/khaledSayedAbdellah/aegis
issue_tracker: https://github.com/khaledSayedAbdellah/aegis/issues

topics:
  - security
  - static-analysis
  - cli
  - owasp
  - flutter

environment:
  sdk: '>=3.0.0 <4.0.0'

# A command-line tool for desktop and CI hosts; it does not run on devices.
platforms:
  linux:
  macos:
  windows:

dependencies:
  archive: ^4.0.0
  args: ^2.4.0
  crypto: ^3.0.0
  path: ^1.8.0
  xml: '>=6.0.0 <8.0.0'
  yaml: ^3.1.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.24.0

executables:
  aegis: aegis

# Deliberately synthetic credentials used to exercise secret detection.
# Keep this allowlist restricted to these test/fixture sources.
false_secrets:
  - /test/baseline_test.dart
  - /test/scoring_test.dart
  - /tool/make_apk_fixtures.py
  - /tool/make_aab_fixtures.py
