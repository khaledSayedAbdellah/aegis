# Publishes to pub.dev when a version tag is pushed, for example:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The tag must match `version:` in pubspec.yaml. pub.dev accepts only runs
# from this repository started by a tag matching its pattern `v{{version}}`.
# After publishing, a GitHub Release is created from the tag's CHANGELOG.md
# section, and the GitHub Action in action/ is copied to
# khaledSayedAbdellah/aegis-action with tags vX.Y.Z and v1.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      id-token: write # pub.dev authenticates the run with GitHub's OIDC token
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The CHANGELOG section for this version: from "## X.Y.Z" up to the
          # next "## " heading ("### " subsections stay in).
          awk -v v="$version" '$0 == "## " v {f=1; next} f && /^## / {exit} f' \
            CHANGELOG.md > section.md
          if ! grep -q '[^[:space:]]' section.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          {
            printf 'Install from [pub.dev](https://pub.dev/packages/aegis/versions/%s):\n\n' "$version"
            printf '```bash\ndart pub global activate aegis %s\n```\n\n' "$version"
            cat section.md
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --title "aegis $version" --notes-file notes.md
          fi

  # Copies action/ to the aegis-action repository, which GitHub Marketplace
  # lists. Needs the secret ACTION_DEPLOY_KEY: the private half of a deploy
  # key with write access on aegis-action.
  action:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the deploy key
        id: key
        env:
          KEY: ${{ secrets.ACTION_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::ACTION_DEPLOY_KEY is not set: the GitHub Action was not updated."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # pub.dev can take a few minutes to serve a new version. The action's
      # own tests start as soon as it is pushed and install this version.
      - name: Wait for pub.dev
        if: steps.key.outputs.present == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for i in $(seq 1 30); do
            if curl -fsS -H 'Accept: application/vnd.pub.v2+json' \
                https://pub.dev/api/packages/aegis |
                jq -e --arg v "$version" 'any(.versions[]; .version == $v)' > /dev/null; then
              echo "pub.dev serves aegis $version."
              exit 0
            fi
            sleep 20
          done
          echo "::error::pub.dev does not list aegis $version after 10 minutes."
          exit 1
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          path: aegis
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          repository: khaledSayedAbdellah/aegis-action
          ssh-key: ${{ secrets.ACTION_DEPLOY_KEY }}
          path: aegis-action
          fetch-depth: 0
      - name: Publish the action
        if: steps.key.outputs.present == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          rsync -a --delete --exclude .git aegis/action/ aegis-action/
          echo "$version" > aegis-action/aegis-version.txt
          cd aegis-action
          # Commits carry the release author, not a bot.
          git config user.name "$(git -C ../aegis log -1 --format=%an)"
          git config user.email "$(git -C ../aegis log -1 --format=%ae)"
          git add -A
          if git diff --cached --quiet; then
            echo "The action is unchanged."
          else
            git commit -q -m "aegis $version"
          fi
          git tag -f "$TAG"
          git tag -f v1
          git push origin HEAD:main
          git push -f origin "refs/tags/$TAG" refs/tags/v1
