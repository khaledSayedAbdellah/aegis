name: Feature request
description: A new rule, option, platform or report format.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem you are trying to solve, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How aegis could help. For a new rule, include the MASVS control and an example of insecure and fixed code if you can.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds or other tools you use for this.
