name: Bug report
description: aegis crashes, hangs, rejects valid input or produces a broken report.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a finding that is wrong or a problem aegis misses, use **Rule accuracy** instead.
        Remove secrets, keys and private code from everything you paste.
  - type: input
    id: version
    attributes:
      label: aegis version
      description: Output of `aegis --version`.
      placeholder: aegis 0.11.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Dart version
      description: For example macOS 15 and the output of `dart --version`.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: aegis run . --mode apk --apk build/app-release.apk
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the error or the relevant part of the output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: aegis.yaml
      description: If the project has one.
      render: yaml
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal project, file or steps that trigger it, if you can share one.
